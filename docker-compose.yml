services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - AUTH_SECRET=change-this-secret
    volumes:
      - backend_data:/app/app/data
      - backend_uploads:/app/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
